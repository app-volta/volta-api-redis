server:
  port: 8081
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: volta-api-redis
  lifecycle:
    timeout-per-shutdown-phase: 20s

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}

volta:
  jwt:
    secret: ${JWT_KEY}
    expiration: ${JWT_EXPIRATION:86400000}

  api:
    base-url: ${VOLTA_API_URL:http://localhost:8080}
    timeout-millis: ${VOLTA_API_TIMEOUT_MILLIS:3000}

  scoring:
    default-radius-km: 100
    unrated-factor: 0.5
    high-risk-fit: 0.4
    urgent-weights:
      distance: 0.6
      rating: 0.2
      fit: 0.2
    standard-weights:
      distance: 0.4
      rating: 0.3
      fit: 0.3

  redis:
    keys:
      ranking: ranking:companies
      ranking-history: ranking:history
      cooperatives: geo:cooperatives

springdoc:
  api-docs:
    enabled: false
    path: /api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,redis
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: local

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
