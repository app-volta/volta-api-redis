server:
  port: 8081

spring:
  application:
    name: volta-api-redis

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}

volta:
  jwt:
    # Mesma chave da volta-api (JWT_KEY): o token gerado lá precisa valer aqui.
    # Sem valor padrão de propósito: o repositório é público.
    secret: ${JWT_KEY}
    expiration: ${JWT_EXPIRATION:86400000}

  redis:
    keys:
      ranking: ranking:companies
      cooperatives: geo:cooperatives

springdoc:
  api-docs:
    enabled: false
    path: /api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,redis
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: local

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
